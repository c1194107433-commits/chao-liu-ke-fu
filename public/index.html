<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮玩客服 · 有依据才回答</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/"><span>潮</span>潮玩客服</a><small id="connection">正在检查配置…</small></header><main><section class="intro"><div class="eyebrow">TOY CARE / 智能客服工作空间</div><h1>热爱潮玩，认真回答。</h1><p>让每一次咨询，都得到有依据的回应。</p></section><div class="workspace"><section class="card source"><div class="panel-head"><span>01 / 输入信息</span><small>CONTEXT</small></div><form id="form"><label for="question">买家问题 <small>最多 2000 字</small></label><textarea id="question" placeholder="例如：这个娃娃有多高？隐藏款概率是多少？" maxlength="2000" required></textarea><label for="product">商品资料 <small>仅根据这些资料回答</small></label><textarea id="product" maxlength="20000" placeholder="填写商品的尺寸、材质、规格、包装等明确资料…" required></textarea><div class="source-actions"><span>店铺客服可编辑本次资料</span><button id="reset" type="button">恢复默认资料</button></div><div class="rule"><span>回复规则</span><p>参数有依据，自动回复<br>物流、售后或拿不准，待人工处理</p></div><label for="access-code">朋友访问码 <small>由分享者提供</small></label><input id="access-code" type="password" autocomplete="off" placeholder="输入访问码（本地未启用时可留空）"><button id="submit" type="submit">分析问题并生成回复 ↗</button><div class="hint">Enter 发送 · Shift + Enter 换行</div></form></section><section class="card result"><div class="panel-head"><span>02 / 处理结果</span><small>RESPONSE</small></div><div class="status-legend"><span>● 自动回复</span><span>● 异常 / 待核实</span></div><div id="messages" aria-live="polite"><div class="welcome"><div class="spark">✧</div><p>准备好，接住每一个好问题。</p><p>填写问题与资料，回复将在这里呈现。</p></div></div></section></div><section class="queue" hidden><div class="queue-heading"><h2>待人工处理 <span id="count">0</span></h2><small>仅当前页面记录，尚未接入真人客服</small></div><div id="queue"></div></section><footer>潮玩客服 × Dify · 有依据才回答，不确定不承诺</footer></main><script src="/app.js"></script></body></html>
